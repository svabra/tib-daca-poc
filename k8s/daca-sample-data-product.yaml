apiVersion: apps/v1
kind: Deployment
metadata:
  name: daca-sample-data-product
  namespace: daai-brs-d
  labels:
    app.kubernetes.io/name: daca-sample-data-product
    app.kubernetes.io/part-of: tib-daca-poc
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: daca-sample-data-product
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daca-sample-data-product
        app.kubernetes.io/part-of: tib-daca-poc
    spec:
      containers:
        - name: sample-data-product
          image: docker-hub.nexus.bit.admin.ch/svabra/tib-daca-sample-data-product:0.1.6
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOME
              value: /tmp
            - name: ROOT_PATH
              value: /sample-api
            - name: PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: tib-daail-evo1-poc-query-engine-config
                  key: PG_HOST
            - name: PG_PORT
              valueFrom:
                configMapKeyRef:
                  name: tib-daail-evo1-poc-query-engine-config
                  key: PG_PORT
            - name: PG_OLTP_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: tib-daail-evo1-poc-query-engine-config
                  key: PG_OLTP_DATABASE
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: tib-daail-evo1-poc-query-engine-secret
                  key: PG_USER
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tib-daail-evo1-poc-query-engine-secret
                  key: PG_PASSWORD
          envFrom:
            - configMapRef:
                name: tib-daca-poc-config
            - secretRef:
                name: tib-daca-poc-secret
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 75m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: daca-sample-data-product
  namespace: daai-brs-d
  labels:
    app.kubernetes.io/name: daca-sample-data-product
spec:
  selector:
    app.kubernetes.io/name: daca-sample-data-product
  ports:
    - name: http
      port: 8000
      targetPort: http
