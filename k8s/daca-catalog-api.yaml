apiVersion: apps/v1
kind: Deployment
metadata:
  name: daca-catalog-api
  namespace: daai-brs-d
  labels:
    app.kubernetes.io/name: daca-catalog-api
    app.kubernetes.io/part-of: tib-daca-poc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: daca-catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daca-catalog-api
        app.kubernetes.io/part-of: tib-daca-poc
    spec:
      containers:
        - name: catalog-api
          image: docker-hub.nexus.bit.admin.ch/svabra/tib-daca-catalog-api:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: HOME
              value: /tmp
            - name: ROOT_PATH
              value: /catalog-api
          envFrom:
            - configMapRef:
                name: tib-daca-poc-config
            - secretRef:
                name: tib-daca-poc-secret
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: daca-catalog-api
  namespace: daai-brs-d
  labels:
    app.kubernetes.io/name: daca-catalog-api
spec:
  selector:
    app.kubernetes.io/name: daca-catalog-api
  ports:
    - name: http
      port: 8001
      targetPort: http
