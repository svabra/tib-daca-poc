apiVersion: v1
kind: Secret
metadata:
  name: tib-daca-poc-secret
  namespace: daai-brs-d
  labels:
    app.kubernetes.io/part-of: tib-daca-poc
type: Opaque
stringData:
  # Replace the host with the same PostgreSQL service used by DAAIF. DaCa uses
  # its own databases and roles; never reuse the DAAIF database password.
  DATABASE_URL: postgresql+psycopg://daca_catalog:replace-me@replace-me-postgres-service:5432/daca_catalog
  ALEMBIC_DATABASE_URL: postgresql+psycopg://daca_sample_owner:replace-me@replace-me-postgres-service:5432/daca_sample
  SAMPLE_DATABASE_URL: postgresql+psycopg://daca_sample_api:replace-me@replace-me-postgres-service:5432/daca_sample
  POLICY_PROJECTOR_DATABASE_URL: postgresql+psycopg://daca_policy_projector:replace-me@replace-me-postgres-service:5432/daca_sample
  DACA_POLICY_DEPLOYMENT_TOKEN: replace-with-a-long-random-token
  SAMPLE_POLICY_PROJECTION_TOKEN: replace-with-the-same-policy-deployment-token
  INTERNAL_TOKEN: replace-with-a-second-long-random-token
  CATALOG_INTERNAL_TOKEN: replace-with-the-same-internal-token
