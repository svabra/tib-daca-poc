name: daca-data-analyst-journey

services:
  daca-postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: daca_admin
      POSTGRES_PASSWORD: journey_daca_admin
      POSTGRES_DB: postgres
      CATALOG_DB_PASSWORD: journey_daca_catalog
      CONTROL_PLANE_DB_PASSWORD: journey_unused_control
      SAMPLE_DB_OWNER_PASSWORD: journey_sample_owner
      SAMPLE_DB_PASSWORD: journey_sample_api
      POLICY_PROJECTOR_DB_PASSWORD: journey_projector
      SG_DB_PASSWORD: journey_sg
      BERN_DB_PASSWORD: journey_bern
    volumes:
      - daca-postgres-data:/var/lib/postgresql
      - ${DACA_REPO}/infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daca_admin -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40

  catalog-api:
    image: daca-journey-catalog-api:${DACA_GIT_SHA}
    build:
      context: ${DACA_REPO}/services/catalog-api
    environment:
      DATABASE_URL: postgresql+psycopg://daca_catalog:journey_daca_catalog@daca-postgres:5432/daca_catalog
      ROOT_PATH: /catalog-api
      DACA_DEMO_AUTH: "true"
      DACA_OPEN_METADATA_PUBLICATION: "true"
      SAMPLE_POLICY_PROJECTION_URL: http://sample-data-product:8000/internal/v1/policy-projections
      SAMPLE_POLICY_PROJECTION_TOKEN: journey-policy-token
      # Must match infra/opa/config.yaml so OPA can report bundle activation.
      INTERNAL_TOKEN: local-development-only
    depends_on:
      daca-postgres:
        condition: service_healthy
    networks:
      default:
        aliases: [daca-catalog-api]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s

  opa:
    image: openpolicyagent/opa:1.18.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--config-file=/config/config.yaml"]
    volumes:
      - ${DACA_REPO}/infra/opa/config.yaml:/config/config.yaml:ro
    depends_on:
      catalog-api:
        condition: service_healthy

  sample-data-product:
    image: daca-journey-sample-data-product:${DACA_GIT_SHA}
    build:
      context: ${DACA_REPO}/services/sample-data-product
    environment:
      ALEMBIC_DATABASE_URL: postgresql+psycopg://daca_sample_owner:journey_sample_owner@daca-postgres:5432/daca_sample
      ROOT_PATH: /sample-api
      SAMPLE_DATABASE_URL: postgresql+psycopg://daca_sample_api:journey_sample_api@daca-postgres:5432/daca_sample
      POLICY_PROJECTOR_DATABASE_URL: postgresql+psycopg://daca_policy_projector:journey_projector@daca-postgres:5432/daca_sample
      OPA_DECISION_URL: http://opa:8181/v1/data/daca/authz/decision
      DACA_POLICY_DEPLOYMENT_TOKEN: journey-policy-token
      DACA_DEMO_AUTH: "true"
      CATALOG_DEPLOYMENT_ACK_URL: http://catalog-api:8001/internal/v1/policy-deployments/acknowledge
      CATALOG_INTERNAL_TOKEN: local-development-only
    depends_on:
      daca-postgres:
        condition: service_healthy
      opa:
        condition: service_started
    networks:
      default:
        aliases: [daca-sample-data-product]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s

  catalog-ui:
    image: daca-journey-catalog-ui:${DACA_GIT_SHA}
    build:
      context: ${DACA_REPO}
      dockerfile: apps/catalog-ui/Dockerfile
    ports:
      - "127.0.0.1:${DACA_UI_PORT}:8080"
    depends_on:
      catalog-api:
        condition: service_healthy
      sample-data-product:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30

  daaif-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: evo1
      POSTGRES_PASSWORD: evo1
    volumes:
      - daaif-postgres-data:/var/lib/postgresql/data
      - ${DAAIF_REPO}/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evo1 -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - daaif-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 40

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/vat-smoke-test &&
        mc mb --ignore-existing local/data-analysts-journey
    restart: "no"

  daaif:
    image: daca-journey-daaif:${DAAIF_GIT_SHA}
    build:
      context: ${DAAIF_REPO}
      dockerfile: bdw/Dockerfile
    environment:
      PORT: "8000"
      BDW_ENABLE_FILE_LOGGING: "false"
      DUCKDB_DATABASE: /workspace/bit-data-workbench.duckdb
      DUCKDB_EXTENSION_DIRECTORY: /opt/duckdb/extensions
      S3_ENDPOINT: minio:9000
      S3_BUCKET: vat-smoke-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_URL_STYLE: path
      S3_USE_SSL: "false"
      S3_VERIFY_SSL: "false"
      S3_STARTUP_VIEW_SCHEMA: s3
      PG_HOST: daaif-postgres
      PG_PORT: "5432"
      PG_USER: evo1
      PG_PASSWORD: evo1
      PG_OLTP_DATABASE: evo1_oltp
      PG_OLAP_DATABASE: evo1_olap
      DACA_BASE_URL: http://catalog-api:8001
      DACA_UI_URL: http://127.0.0.1:${DACA_UI_PORT}
      DACA_OPA_URL: http://opa:8181/v1/data/daca/authz/decision
      DACA_HTTP_TIMEOUT_SECONDS: "15"
    ports:
      - "127.0.0.1:${DAAIF_UI_PORT}:8000"
    volumes:
      - daaif-workspace:/workspace
    depends_on:
      daaif-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      catalog-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 40
      start_period: 20s

volumes:
  daca-postgres-data:
  daaif-postgres-data:
  daaif-minio-data:
  daaif-workspace:
