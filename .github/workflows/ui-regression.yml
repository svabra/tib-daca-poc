name: UI regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modeling-ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Chromium for the CDP regression browser
        id: chromium
        uses: browser-actions/setup-chrome@v2
      - name: Start catalog UI and API
        run: docker compose up --build --wait postgres catalog-api catalog-ui
      - name: Run logical-model UI regression
        run: >-
          npm run test:ui-regression --
          --base-url http://127.0.0.1:8080
          --edge-path "${{ steps.chromium.outputs.chrome-path }}"
          --screenshot-dir output/ui-regression
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logical-model-ui-regression-${{ github.run_id }}
          path: output/ui-regression/
          if-no-files-found: warn
          retention-days: 3
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
