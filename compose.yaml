name: bit-daca

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: daca_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-daca_admin_dev}
      POSTGRES_DB: postgres
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-daca_catalog_dev}
      CONTROL_PLANE_DB_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD:-daca_control_dev}
      SAMPLE_DB_OWNER_PASSWORD: ${SAMPLE_DB_OWNER_PASSWORD:-daca_sample_owner_dev}
      SAMPLE_DB_PASSWORD: ${SAMPLE_DB_PASSWORD:-daca_sample_api_dev}
      POLICY_PROJECTOR_DB_PASSWORD: ${POLICY_PROJECTOR_DB_PASSWORD:-daca_projector_dev}
      SG_DB_PASSWORD: ${SG_DB_PASSWORD:-daca_sg_dev}
      BERN_DB_PASSWORD: ${BERN_DB_PASSWORD:-daca_bern_dev}
    ports:
      - "55432:5432"
    volumes:
      - daca-postgres:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  catalog-api:
    build:
      context: ./services/catalog-api
    environment:
      DATABASE_URL: postgresql+psycopg://daca_catalog:${CATALOG_DB_PASSWORD:-daca_catalog_dev}@postgres:5432/daca_catalog
      ROOT_PATH: /catalog-api
      SEED_ON_STARTUP: "false"
      CORS_ORIGINS: '["http://localhost:8080"]'
      DACA_DEMO_AUTH: ${DACA_DEMO_AUTH:-true}
      DACA_OPEN_METADATA_PUBLICATION: ${DACA_OPEN_METADATA_PUBLICATION:-true}
      SAMPLE_POLICY_PROJECTION_URL: http://sample-data-product:8000/internal/v1/policy-projections
      SAMPLE_POLICY_PROJECTION_TOKEN: ${DACA_POLICY_DEPLOYMENT_TOKEN:-change-me-in-production}
      INTERNAL_TOKEN: local-development-only
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
        aliases:
          - daca-catalog-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "5051:80"
    volumes:
      - daca-pgadmin:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./infra/pgadmin/pgpass:/pgpass:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  control-plane-api:
    build:
      context: ./services/control-plane-api
    environment:
      DACA_CONTROL_DATABASE_URL: postgresql+psycopg://daca_control:${CONTROL_PLANE_DB_PASSWORD:-daca_control_dev}@postgres:5432/daca_control_plane
      DACA_CONTROL_SEED_ON_STARTUP: "false"
      DACA_CONTROL_CORS_ORIGINS: http://localhost:8081
      DACA_CONTROL_HEALTH_POLL_INTERVAL_SECONDS: "15"
      DACA_CONTROL_DEMO_AUTH: ${DACA_CONTROL_DEMO_AUTH:-true}
      DACA_CONTROL_ENDPOINT_HOST_ALLOWLIST: ${DACA_CONTROL_ENDPOINT_HOST_ALLOWLIST:-catalog-api}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.18.2
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --config-file=/config/config.yaml
    volumes:
      - ./infra/opa/config.yaml:/config/config.yaml:ro
    ports:
      - "8181:8181"
    depends_on:
      catalog-api:
        condition: service_healthy
    restart: unless-stopped

  sample-data-product:
    build:
      context: ./services/sample-data-product
    environment:
      ALEMBIC_DATABASE_URL: postgresql+psycopg://daca_sample_owner:${SAMPLE_DB_OWNER_PASSWORD:-daca_sample_owner_dev}@postgres:5432/daca_sample
      ROOT_PATH: /sample-api
      SAMPLE_DATABASE_URL: postgresql+psycopg://daca_sample_api:${SAMPLE_DB_PASSWORD:-daca_sample_api_dev}@postgres:5432/daca_sample
      POLICY_PROJECTOR_DATABASE_URL: postgresql+psycopg://daca_policy_projector:${POLICY_PROJECTOR_DB_PASSWORD:-daca_projector_dev}@postgres:5432/daca_sample
      OPA_DECISION_URL: http://opa:8181/v1/data/daca/authz/decision
      DACA_POLICY_DEPLOYMENT_TOKEN: ${DACA_POLICY_DEPLOYMENT_TOKEN:-change-me-in-production}
      DACA_DEMO_AUTH: ${DACA_DEMO_AUTH:-true}
      CATALOG_DEPLOYMENT_ACK_URL: http://catalog-api:8001/internal/v1/policy-deployments/acknowledge
      CATALOG_INTERNAL_TOKEN: local-development-only
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
    networks:
      default:
        aliases:
          - daca-sample-data-product
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  catalog-ui:
    build:
      context: .
      dockerfile: apps/catalog-ui/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      catalog-api:
        condition: service_healthy
    restart: unless-stopped

  control-plane-ui:
    build:
      context: .
      dockerfile: apps/control-plane-ui/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      control-plane-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  daca-postgres:
  daca-pgadmin:
