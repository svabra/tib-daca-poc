  <!-- One complete pass starts empty; its protected product reaches all consumers together. -->
  @for (batch of batches; track batch) {
    @for (consumer of consumers; track consumer) {
      <g class="flow-product" [attr.data-batch]="batch" [attr.data-consumer]="consumer" opacity="0">
        <circle class="product-halo" r="0"/><circle class="product-body" r="0"/>
        <g class="product-shield" transform="scale(0)"><use href="/assets/documentation/animation-icons.svg#shield-check" x="-18.5" y="-18.5" width="37" height="37"/></g>
      </g>
    }
  }
  <!-- Keep collected points visible above the product while they are being welded. -->
  @for (batch of batches; track batch) {
    @for (color of colors; track color) {
      <g class="flow-particle" opacity="0"><circle class="particle-halo" r="12"/><circle class="particle-core" r="5"/></g>
    }
  }
