server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://control-plane-api:8002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Angular must always revalidate its application shell and service-worker
  # control files. Hashed application assets remain immutable below.
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location = /ngsw.json {
    expires -1;
    try_files $uri =404;
  }

  location = /ngsw-worker.js {
    expires -1;
    try_files $uri =404;
  }

  location = /safety-worker.js {
    expires -1;
    try_files $uri =404;
  }

  location = /worker-basic.min.js {
    expires -1;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|png|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
