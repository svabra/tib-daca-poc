[project]
name = "daca-sample-data-product"
version = "0.1.8"
description = "Synthetic ESTV data product with OPA and PostgreSQL policy enforcement"
requires-python = ">=3.14"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.51",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
