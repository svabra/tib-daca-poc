[project]
name = "daca-control-plane-api"
version = "0.1.22"
description = "BIT DaCa control-plane API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.51",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
]

[project.scripts]
daca-control-plane-seed = "daca_control_plane.seed:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daca_control_plane"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["daca_control_plane"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
