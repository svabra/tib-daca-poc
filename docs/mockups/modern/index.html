<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../../../packages/design-system/assets/favicon.ico">
  <title>BIT DaCa — Modern design concepts</title>
  <style>
    :root {
      --red: #d52b1e;
      --red-dark: #a51e15;
      --red-soft: #fff0ee;
      --blue: #0b4479;
      --blue-bright: #1769aa;
      --blue-soft: #eaf3fa;
      --amber: #b96d00;
      --amber-soft: #fff3db;
      --green: #14734b;
      --green-soft: #e7f6ee;
      --ink: #17212b;
      --muted: #61707c;
      --line: #d9e0e5;
      --paper: #fff;
      --canvas: #f3f6f8;
      --shadow: 0 14px 38px rgba(25, 42, 58, .09);
      --font: "Frutiger", "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { min-width: 1180px; background: var(--canvas); color: var(--ink); font-family: var(--font); }
    body { margin: 0; min-height: 100vh; background: var(--canvas); }
    button, input, select, textarea { font: inherit; }
    a { color: inherit; }
    button, a, input, select, textarea { outline-offset: 3px; }
    :focus-visible { outline: 3px solid rgba(11, 68, 121, .38); }
    .skip { position: fixed; z-index: 30; left: 12px; top: 8px; transform: translateY(-150%); padding: 9px 12px; background: #111; color: #fff; }
    .skip:focus { transform: none; }

    .authority {
      height: 30px;
      border-bottom: 1px solid #d8d8d8;
      background: #f4f4f4;
      color: #42484d;
      font-size: 11px;
    }
    .authority__inner, .brand__inner, .viewbar__inner {
      width: min(100% - 64px, 1536px);
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .languages { display: flex; align-self: stretch; }
    .languages span { display: grid; place-items: center; min-width: 34px; font-weight: 650; }
    .languages .active { background: #fff; color: #111; }
    .brand {
      height: 78px;
      border-bottom: 4px solid var(--red);
      background: #fff;
    }
    .brand__logo { width: 214px; height: auto; display: block; }
    .brand__product { display: flex; align-items: center; gap: 18px; margin-left: 38px; padding-left: 38px; border-left: 1px solid var(--line); }
    .brand__product small { display: block; margin-bottom: 2px; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .brand__product strong { font-size: 18px; letter-spacing: -.01em; }
    .brand__left { display: flex; align-items: center; }
    .brand__right { display: flex; align-items: center; gap: 16px; }
    .environment { display: flex; align-items: center; gap: 8px; color: #43505a; font-size: 12px; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 11px; font-weight: 800; }

    .viewbar { height: 48px; border-bottom: 1px solid var(--line); background: #fff; box-shadow: 0 6px 18px rgba(32, 48, 61, .04); }
    .viewbar__label { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 760; }
    .viewbar__label svg { width: 17px; color: var(--red); }
    .concepts { display: flex; align-self: stretch; gap: 2px; }
    .concepts a { position: relative; display: flex; align-items: center; padding: 0 18px; color: var(--muted); font-size: 12px; font-weight: 680; text-decoration: none; }
    .concepts a:hover { background: #f8fafb; color: var(--ink); }
    .concepts a.active { color: var(--red); }
    .concepts a.active::after { content: ""; position: absolute; right: 16px; bottom: -1px; left: 16px; height: 3px; background: var(--red); }
    .concepts b { margin-right: 7px; color: #98a2aa; font-family: var(--mono); font-size: 10px; }

    main { width: min(100% - 64px, 1536px); margin: 0 auto; padding: 24px 0 30px; }
    .eyebrow { margin: 0 0 6px; color: var(--red); font-size: 10px; font-weight: 850; letter-spacing: .11em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 7px; font-size: 30px; line-height: 1.07; letter-spacing: -.035em; }
    h2 { font-size: 15px; letter-spacing: -.01em; }
    h3 { font-size: 13px; }
    .lede { max-width: 770px; margin-bottom: 0; color: var(--muted); font-size: 13px; line-height: 1.48; }
    .page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; margin-bottom: 18px; }
    .page-actions { display: flex; gap: 8px; }
    .button { display: inline-flex; min-height: 36px; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); border-radius: 7px; padding: 7px 13px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 760; cursor: pointer; }
    .button.primary { border-color: var(--red); background: var(--red); color: #fff; }
    .button svg { width: 15px; }
    .button.primary:hover { background: var(--red-dark); }
    .status { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #b9decf; border-radius: 999px; padding: 3px 8px; background: var(--green-soft); color: var(--green); font-size: 10px; font-weight: 800; white-space: nowrap; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.amber { border-color: #ead2a8; background: var(--amber-soft); color: #8a5200; }
    .status.blue { border-color: #b7cfe2; background: var(--blue-soft); color: var(--blue); }
    .status.red { border-color: #e6b9b5; background: var(--red-soft); color: var(--red-dark); }
    .card { border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: var(--shadow); overflow: hidden; }
    .card-head { min-height: 43px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .card-head h2, .card-head h3 { margin: 0; }
    .card-body { padding: 14px; }
    .kicker { color: var(--muted); font-size: 10px; font-weight: 720; letter-spacing: .06em; text-transform: uppercase; }
    .mono { font-family: var(--mono); }

    label { display: grid; gap: 5px; color: #46535d; font-size: 10px; font-weight: 780; letter-spacing: .025em; }
    input, select, textarea { width: 100%; border: 1px solid #cbd4da; border-radius: 6px; padding: 8px 9px; background: #fff; color: var(--ink); font-size: 12px; }
    input, select { height: 34px; }
    textarea { min-height: 56px; resize: none; line-height: 1.35; }
    .form-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 10px 12px; }
    .span-2 { grid-column: 1 / -1; }
    .field-note { color: #7b878f; font-size: 9px; font-weight: 500; }
    .table-wrap { overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
    th { padding: 7px 9px; background: #f4f7f8; color: #687680; font-size: 8px; letter-spacing: .08em; text-align: left; text-transform: uppercase; }
    td { padding: 8px 9px; border-top: 1px solid #e4e9ec; vertical-align: middle; }
    code { border-radius: 4px; padding: 2px 5px; background: #f1f4f6; color: #30414f; font-family: var(--mono); font-size: 9px; }
    .proto { display: inline-flex; min-width: 72px; align-items: center; gap: 5px; font-weight: 800; }
    .proto::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--blue); }
    .proto.pg::before { background: var(--red); }
    .muted { color: var(--muted); }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: 9px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 8px; height: 8px; border-radius: 2px; }
    .legend .source { background: var(--blue); }
    .legend .transform { background: var(--amber); }
    .legend .product { background: var(--red); }
    .legend .consumer { background: var(--green); }

    /* Concept 1: Swiss Grid Workspace */
    .grid-page { position: relative; }
    .grid-page::before { content: ""; position: fixed; z-index: -1; inset: 156px 0 0; background-image: linear-gradient(rgba(11, 68, 121, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(11, 68, 121, .035) 1px, transparent 1px); background-size: 28px 28px; }
    .workspace-grid { display: grid; grid-template-columns: 1.02fr 1.42fr .82fr; grid-template-rows: 276px 235px; gap: 14px; }
    .workspace-grid .metadata { grid-row: 1 / span 2; }
    .workspace-grid .lineage { grid-column: 2 / span 2; }
    .workspace-grid .interfaces { grid-column: 2; }
    .workspace-grid .evidence { grid-column: 3; }
    .grid-product-id { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 8px 9px; border-left: 3px solid var(--red); background: var(--red-soft); color: #6b302c; font-size: 9px; }
    .grid-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 11px; }
    .grid-meta div { padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: #f9fbfc; }
    .grid-meta b { display: block; margin-bottom: 2px; color: var(--muted); font-size: 8px; text-transform: uppercase; }
    .grid-meta span { font-size: 10px; font-weight: 740; }
    .lineage-svg { display: block; width: 100%; height: 174px; }
    .lineage-svg text { font-family: var(--font); }
    .activity-list { display: grid; gap: 9px; }
    .activity { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
    .activity__icon { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--blue-soft); color: var(--blue); font-size: 9px; font-weight: 900; }
    .activity p { margin: 1px 0 0; color: #3b4853; font-size: 9.5px; line-height: 1.3; }
    .activity small { display: block; margin-top: 2px; color: #859099; font-size: 8px; }

    /* Concept 2: Alpine Control Canvas */
    body[data-view="canvas"] { background: #e9eef2; }
    body[data-view="canvas"] main { width: calc(100% - 42px); max-width: 1570px; padding-top: 18px; }
    .canvas-page .page-title { margin: 0 0 14px; padding: 0 4px; }
    .canvas-shell { height: 604px; display: grid; grid-template-columns: 196px 1fr 318px; border: 1px solid #bec8d0; border-radius: 14px; background: #fff; box-shadow: 0 20px 48px rgba(21, 38, 51, .14); overflow: hidden; }
    .canvas-nav { padding: 16px 12px; background: #112d45; color: #fff; }
    .canvas-nav__title { display: flex; align-items: center; gap: 9px; margin: 0 5px 18px; font-size: 11px; font-weight: 800; letter-spacing: .04em; }
    .canvas-nav__mark { width: 22px; height: 22px; border: 5px solid var(--red); border-radius: 50%; }
    .canvas-nav small { display: block; margin: 16px 7px 7px; color: #80a0ba; font-size: 8px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .canvas-nav a { display: flex; align-items: center; justify-content: space-between; min-height: 34px; margin: 2px 0; border-radius: 7px; padding: 0 9px; color: #d6e2ea; font-size: 10px; font-weight: 650; text-decoration: none; }
    .canvas-nav a.active { background: #1d4d73; color: #fff; }
    .canvas-nav em { min-width: 19px; border-radius: 999px; padding: 2px 5px; background: rgba(255,255,255,.12); font-size: 8px; font-style: normal; text-align: center; }
    .canvas-nav__health { margin-top: 144px; border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: 10px; background: rgba(255,255,255,.05); }
    .canvas-nav__health b { display: block; margin-bottom: 5px; font-size: 9px; }
    .canvas-nav__health p { margin: 0; color: #b8cbd9; font-size: 8px; line-height: 1.35; }
    .topology { position: relative; overflow: hidden; border-right: 1px solid var(--line); background: radial-gradient(circle at 48% 42%, #fff 0, #f8fafb 52%, #edf2f5 100%); }
    .topology::before { content: ""; position: absolute; inset: 0; opacity: .35; background-image: radial-gradient(#8396a5 1px, transparent 1px); background-size: 18px 18px; }
    .topology-head { position: relative; z-index: 2; display: flex; align-items: flex-start; justify-content: space-between; padding: 15px 17px; }
    .topology-head h2 { margin: 0 0 3px; font-size: 14px; }
    .topology-head p { margin: 0; color: var(--muted); font-size: 9px; }
    .topology-tools { display: flex; gap: 5px; }
    .tool { display: grid; place-items: center; width: 27px; height: 27px; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,.9); color: #40515f; font-size: 12px; }
    .topology-svg { position: relative; z-index: 1; display: block; width: 100%; height: 330px; }
    .topology-svg text { font-family: var(--font); }
    .canvas-table { position: absolute; z-index: 3; right: 14px; bottom: 13px; left: 14px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.96); box-shadow: 0 10px 25px rgba(27, 46, 60, .08); overflow: hidden; }
    .canvas-table__title { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 9px; font-weight: 780; }
    .inspector { display: flex; min-width: 0; flex-direction: column; background: #fff; }
    .inspector-head { padding: 14px 15px 11px; border-bottom: 1px solid var(--line); }
    .inspector-head .kicker { margin-bottom: 5px; }
    .inspector-head h2 { margin: 0 0 6px; }
    .inspector-body { display: grid; gap: 9px; padding: 12px 15px; overflow: hidden; }
    .inspector .form-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .inspector input, .inspector select, .inspector textarea { background: #f9fbfc; }
    .inspector textarea { min-height: 48px; }
    .provenance-strip { border: 1px solid var(--line); border-radius: 7px; padding: 8px; background: #f7f9fa; }
    .provenance-strip strong { display: block; margin-bottom: 6px; font-size: 9px; }
    .provenance-strip ol { position: relative; display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .provenance-strip li { display: grid; grid-template-columns: 8px 1fr auto; gap: 6px; align-items: center; font-size: 8px; }
    .provenance-strip i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .provenance-strip time { color: #89949c; font-family: var(--mono); font-size: 7px; }
    .inspector-actions { display: grid; grid-template-columns: 1fr 1.2fr; gap: 7px; margin-top: auto; }

    /* Concept 3: Federal Evidence Dossier */
    body[data-view="dossier"] { background: #edece8; }
    .dossier-page .page-title { margin-bottom: 13px; }
    .dossier { position: relative; display: grid; grid-template-columns: 52px 1.05fr 1fr; grid-template-rows: 263px 246px; gap: 0; border: 1px solid #c9c7c0; background: #fff; box-shadow: 0 20px 50px rgba(45, 43, 35, .12); }
    .dossier::before { content: "CONFIDENTIALITY · INTERNAL"; position: absolute; z-index: 4; top: 17px; right: -7px; border: 1px solid #e0b7b2; padding: 4px 9px; background: #fff4f2; color: var(--red); font-family: var(--mono); font-size: 7px; font-weight: 800; letter-spacing: .09em; transform: rotate(2deg); }
    .dossier-index { grid-row: 1 / span 2; display: flex; align-items: center; justify-content: center; border-right: 1px solid #d8d5ce; background: #f5f3ee; }
    .dossier-index span { color: #7d7a70; font-family: var(--mono); font-size: 8px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; writing-mode: vertical-rl; transform: rotate(180deg); }
    .dossier-section { position: relative; min-width: 0; padding: 16px 18px; border-right: 1px solid #dedbd4; border-bottom: 1px solid #dedbd4; }
    .dossier-section:nth-last-child(-n + 2) { border-bottom: 0; }
    .dossier-section:last-child { border-right: 0; }
    .section-number { position: absolute; top: 14px; right: 15px; color: #d7d5cf; font-family: Georgia, serif; font-size: 28px; line-height: 1; }
    .dossier-section .eyebrow { margin-bottom: 4px; font-size: 8px; }
    .dossier-section h2 { margin: 0 0 4px; font-family: Georgia, "Times New Roman", serif; font-size: 17px; font-weight: 500; }
    .dossier-section .intro { max-width: 90%; margin-bottom: 10px; color: #6c6962; font-family: Georgia, "Times New Roman", serif; font-size: 9.5px; line-height: 1.42; }
    .dossier .form-grid { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .dossier label { font-size: 8px; letter-spacing: .06em; text-transform: uppercase; }
    .dossier input, .dossier select, .dossier textarea { height: 30px; border-width: 0 0 1px; border-radius: 0; padding: 5px 2px; background: transparent; font-family: Georgia, "Times New Roman", serif; font-size: 10px; }
    .dossier textarea { min-height: 38px; }
    .dossier .full { grid-column: 1 / -1; }
    .dossier-svg { display: block; width: 100%; height: 146px; }
    .dossier-svg text { font-family: var(--font); }
    .evidence-ledger { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 7px; }
    .evidence-ledger p { margin: 0; color: #68665f; font-size: 8px; line-height: 1.35; }
    .seal { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid #adc8bc; border-radius: 50%; color: var(--green); font-family: Georgia, serif; font-size: 7px; font-weight: 700; text-align: center; transform: rotate(-7deg); }
    .manifest table { margin-top: 7px; border: 1px solid #dedbd4; }
    .manifest th { background: #f4f2ed; color: #6d6961; }
    .manifest td { padding-block: 7px; border-color: #e5e1d9; }
    .dossier-timeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 11px; border-top: 1px solid #dbd8d0; padding-top: 10px; }
    .dossier-event { position: relative; padding-left: 11px; color: #66635d; font-size: 8px; line-height: 1.32; }
    .dossier-event::before { content: ""; position: absolute; left: 0; top: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--red); }
    .dossier-event b { display: block; color: var(--ink); font-size: 8px; }
    .dossier-event time { color: #969189; font-family: var(--mono); font-size: 7px; }

    /* Concept 4: Glass Observatory */
    body[data-view="glass"] { background: #071b2d; }
    body[data-view="glass"] .viewbar { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.94); backdrop-filter: blur(18px); }
    body[data-view="glass"] main {
      width: 100%;
      max-width: none;
      min-height: 744px;
      padding: 0;
      background:
        radial-gradient(circle at 13% 4%, rgba(39, 151, 255, .42), transparent 29%),
        radial-gradient(circle at 88% 18%, rgba(229, 43, 61, .36), transparent 33%),
        radial-gradient(circle at 72% 90%, rgba(110, 60, 210, .32), transparent 34%),
        linear-gradient(135deg, #061a2c 0%, #0b3d69 46%, #34245f 72%, #631f48 100%);
      overflow: hidden;
    }
    .glass-page { width: min(100% - 64px, 1536px); margin: 0 auto; padding: 17px 0 20px; color: #f8fbff; }
    .glass-hero {
      position: relative;
      height: 112px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 22px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 20px;
      padding: 17px 20px;
      background:
        linear-gradient(115deg, rgba(9, 62, 107, .84), rgba(48, 83, 157, .64) 55%, rgba(198, 36, 65, .72)),
        rgba(255,255,255,.08);
      box-shadow: 0 22px 55px rgba(0, 11, 28, .34), inset 0 1px 0 rgba(255,255,255,.28);
      backdrop-filter: blur(24px) saturate(130%);
      overflow: hidden;
    }
    .glass-hero::after { content: ""; position: absolute; width: 310px; height: 310px; right: 8%; top: -245px; border: 1px solid rgba(255,255,255,.24); border-radius: 50%; box-shadow: 0 0 70px rgba(255,255,255,.13); }
    .glass-hero .eyebrow { margin-bottom: 4px; color: #ffb9b9; }
    .glass-hero h1 { margin: 0 0 5px; color: #fff; font-size: 29px; }
    .glass-hero .lede { max-width: 720px; color: rgba(244,250,255,.8); font-size: 11.5px; }
    .glass-hero-stats { display: flex; gap: 9px; }
    .glass-stat { min-width: 88px; border: 1px solid rgba(255,255,255,.22); border-radius: 13px; padding: 9px 11px; background: rgba(255,255,255,.11); box-shadow: inset 0 1px 0 rgba(255,255,255,.16); backdrop-filter: blur(12px); }
    .glass-stat b { display: block; color: #fff; font-size: 16px; }
    .glass-stat span { color: rgba(238,246,252,.72); font-size: 8px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .glass-actions { position: relative; z-index: 1; display: flex; gap: 8px; }
    .glass-button { min-height: 36px; border: 1px solid rgba(255,255,255,.34); border-radius: 11px; padding: 7px 13px; background: rgba(255,255,255,.12); color: #fff; font-size: 11px; font-weight: 760; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); backdrop-filter: blur(12px); }
    .glass-button.primary { border-color: rgba(255,255,255,.36); background: rgba(224, 0, 26, .9); box-shadow: 0 10px 26px rgba(113, 0, 19, .28), inset 0 1px 0 rgba(255,255,255,.22); }
    .glass-layout { height: 548px; display: grid; grid-template-columns: 420px minmax(0, 1fr) 316px; grid-template-rows: 364px 170px; gap: 14px; margin-top: 14px; }
    .glass-panel { min-width: 0; border: 1px solid rgba(255,255,255,.27); border-radius: 18px; background: rgba(255,255,255,.11); box-shadow: 0 22px 48px rgba(0,12,32,.26), inset 0 1px 0 rgba(255,255,255,.18); backdrop-filter: blur(22px) saturate(125%); overflow: hidden; }
    .glass-panel-head { min-height: 47px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.18); }
    .glass-panel-head h2 { margin: 0; color: #fff; font-size: 14px; }
    .glass-panel-head p { margin: 2px 0 0; color: rgba(235,246,255,.68); font-size: 8.5px; }
