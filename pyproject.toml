[project]
name = "bit-daca-monorepo"
version = "0.1.3"
description = "BIT Distributed Data Catalog proof of concept"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "journeys/runner"]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["services"]
pythonpath = [
  "services/catalog-api/src",
  "services/control-plane-api/src",
  "services/sample-data-product",
]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
